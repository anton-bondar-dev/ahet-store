<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Cat face (ears + head) in the Ahet brand red -->
  <g fill="#e63946">
    <path d="M5 2 15 11 5 13Z"/>
    <path d="M27 2 17 11 27 13Z"/>
    <circle cx="16" cy="18" r="11.5"/>
  </g>
  <!-- eyes + nose -->
  <g fill="#fff">
    <ellipse cx="11.7" cy="16.5" rx="1.9" ry="2.3"/>
    <ellipse cx="20.3" cy="16.5" rx="1.9" ry="2.3"/>
    <path d="M16 22 14.2 20.2 17.8 20.2Z"/>
  </g>
  <!-- pupils -->
  <g fill="#e63946">
    <circle cx="11.7" cy="16.8" r="0.9"/>
    <circle cx="20.3" cy="16.8" r="0.9"/>
  </g>
  <!-- whiskers -->
  <g stroke="#fff" stroke-width="0.8" stroke-linecap="round">
    <path d="M13 19.5 8.5 18.8M13 21 8.5 21.4"/>
    <path d="M19 19.5 23.5 18.8M19 21 23.5 21.4"/>
  </g>
</svg>
